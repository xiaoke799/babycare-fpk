<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFAD7A"/>
      <stop offset="1" stop-color="#FF86A1"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF6F2"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg)"/>
  <!-- soft sparkle -->
  <circle cx="14.5" cy="15" r="1.4" fill="#FFFFFF" opacity=".55"/>
  <circle cx="50" cy="14" r="1" fill="#FFFFFF" opacity=".45"/>
  <circle cx="52" cy="48" r="1.2" fill="#FFFFFF" opacity=".4"/>
  <!-- head -->
  <circle cx="32" cy="34.5" r="15.2" fill="url(#face)"/>
  <!-- hair curl -->
  <path d="M28.2 21.2c1.2-2.4 4.2-3.2 6.4-1.6" stroke="#E8A090" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- closed happy eyes -->
  <path d="M24.6 32.4c1.1-2.1 3.6-2.1 4.7 0" stroke="#D15A7A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M34.7 32.4c1.1-2.1 3.6-2.1 4.7 0" stroke="#D15A7A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M28.2 38.4c1.7 2.4 5.9 2.4 7.6 0" stroke="#D15A7A" stroke-width="2.1" fill="none" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="23.2" cy="37.2" rx="2.7" ry="1.8" fill="#FFB3C6" opacity=".85"/>
  <ellipse cx="40.8" cy="37.2" rx="2.7" ry="1.8" fill="#FFB3C6" opacity=".85"/>
</svg>
